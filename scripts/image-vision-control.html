<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vision Negative Control</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #f4f4f4; }
  h1 { font-size: 20px; }
  .card { display: inline-block; vertical-align: top; width: 320px; margin: 10px; background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
  .card img { width: 100%; height: 220px; object-fit: cover; display: block; background: #eee; }
  .card .label { padding: 10px; font-size: 14px; }
</style>
</head>
<body>
<h1>Deliberately mismatched labels (control test)</h1>
<div>
  <div class="card"><img src="https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=800" alt="tomato-card" /><div class="label">TOMATO</div></div>
  <div class="card"><img src="https://images.unsplash.com/photo-1592841200221-a6898f307baa?w=800" alt="potato-card" /><div class="label">POTATO</div></div>
  <div class="card"><img src="https://images.unsplash.com/photo-1551754655-cd27e38d2076?w=800" alt="onion-card" /><div class="label">ONION</div></div>
  <div class="card"><img src="https://images.unsplash.com/photo-1618512496248-a07fe83aa8cb?w=800" alt="corn-card" /><div class="label">CORN</div></div>
</div>
</body>
</html>
